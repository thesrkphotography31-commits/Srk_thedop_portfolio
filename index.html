<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Cinematographer & Photographer, Creative Director & Producer. Crafting cinematic stories through film, photography, and commercial TVCs." />
    <meta property="og:title" content="Sriram Karthick — Cinematographer & Photographer" />
    <meta property="og:description" content="Cinematographer & Photographer, Creative Director & Producer. Crafting cinematic stories through film, photography, and commercial TVCs." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="build-version" content="2026.09.14.1-media-repair" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">
    <script>
      (() => {
        const mediaMap = {
          '/sriram-hero.jpg': '/sriram-hero.webp',
          '/sriram-portrait.jpg': '/sriram-portrait.webp'
        };
        const rewrite = (value) => mediaMap[value] || value;
        const srcDescriptor = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
        if (srcDescriptor?.set && srcDescriptor?.get) {
          Object.defineProperty(HTMLImageElement.prototype, 'src', {
            configurable: true,
            enumerable: srcDescriptor.enumerable,
            get: srcDescriptor.get,
            set(value) { srcDescriptor.set.call(this, rewrite(value)); }
          });
        }
        const originalSetAttribute = Element.prototype.setAttribute;
        Element.prototype.setAttribute = function(name, value) {
          if (this instanceof HTMLImageElement && name.toLowerCase() === 'src') value = rewrite(value);
          return originalSetAttribute.call(this, name, value);
        };
      })();
    </script>
  </head>
  <body class="bg-[#0e0e0e] text-[#f0ede8] antialiased selection:bg-[#f0ede8]/20 selection:text-[#f0ede8]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
